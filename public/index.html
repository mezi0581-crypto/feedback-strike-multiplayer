<!doctype html><html lang="ko"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>피드백 스트라이크</title><link rel="stylesheet" href="/style.css"><body><main class="app"><header><h1>피드백 <span>스트라이크!</span></h1><div class="buttons"><button id="help" aria-label="게임 방법">?</button><button id="pause" aria-label="일시정지">Ⅱ</button><button id="menu" aria-label="설정">☰</button></div></header><section class="game-shell"><div class="scorebar"><div class="stat"><label>남은 시간</label><b id="time">02:30</b></div><div class="stat score-stat"><label>내 피드백</label><b id="score">0 PT</b></div><button class="stat rank-stat" id="rankButton" aria-label="전체 순위 보기"><label>내 순위 ↗</label><b id="myRank">—</b></button></div><div class="arena"><canvas id="game" aria-label="누른 채 조준하고 파워를 충전한 뒤 놓아 투구하세요"></canvas><div class="game-state"><span id="opportunity">준비됐나요?</span></div><div id="overlay" class="overlay"><div class="modal" id="modal"></div></div></div><div class="control-strip"><span class="status-dot"></span><span id="hint">누르고 충전 · 놓아서 투구</span></div></section><span id="phasePill" class="visually-hidden"></span></main><dialog id="infoDialog"><div class="dialog-head"><h2 id="infoTitle">게임 방법</h2><button id="closeInfo" aria-label="닫기">×</button></div><p id="liveNote" class="note"></p><section id="helpSection"><ol><li>제출함 방향을 조준해요.</li><li>길게 눌러 파워를 충전해요.</li><li>착지점이 초록색이면 놓으세요!</li></ol><p>회의가 끝났을 때만 피드백을 받아요.</p><div class="steps"><div>GOOD <b>+1</b></div><div>GREAT <b>+2</b></div><div>PERFECT <b>+3</b></div></div><p class="note">3콤보마다 +1 · 5콤보마다 빠른 연속 투구</p></section><section id="rankSection"><div id="ranking"></div><p class="note">최고 연속 성공 <b id="combo">0</b></p></section><section id="settingsSection"><p id="connection"></p><button id="sound" class="secondary">♪ ON</button><button id="leave" class="secondary">게임 나가기</button></section></dialog><div id="notification" class="notification hidden" role="status"></div><script type="module" src="/client.js"></script></body></html>
