<!doctype html><html lang="ko"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>피드백 스트라이크</title><style>*{box-sizing:border-box}body{margin:0;background:#f0e9df;color:#654f43;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #9aaf91;outline-offset:3px}.app{width:min(100% - 32px,1000px);margin:0 auto;padding:20px 0 24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}h1{margin:0;font-size:21px;letter-spacing:-1px;color:#745c4a}h1 span{color:#b37f83}.buttons{display:flex;gap:8px}.buttons button,#closeInfo{width:40px;height:40px;border-radius:14px;background:#fffcf5;border:1px solid #e3d8c9;font-weight:bold;font-size:18px}.buttons button:hover,#closeInfo:hover{background:#f8e2d8}.game-shell{overflow:hidden;border-radius:24px;border:1px solid #e0d2be;background:#fffaf1;box-shadow:0 12px 38px #795f4110}.scorebar{display:grid;grid-template-columns:1fr 1fr 1fr;padding:17px 22px;gap:14px;background:#fffcf6}.stat{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:none;min-width:0}.stat label{font-size:11px;color:#a18b75;letter-spacing:.2px}.stat b{font:700 24px ui-monospace,monospace;color:#725944;white-space:nowrap}.score-stat{border-left:1px solid #eee2d3;border-right:1px solid #eee2d3}.score-stat b{color:#ba8385}.rank-stat:hover{background:#f5eddf;border-radius:12px}.arena{position:relative;touch-action:none;background:#ead9be}canvas{display:block;width:100%;height:auto;aspect-ratio:1000/680;touch-action:none;image-rendering:pixelated}.game-state{position:absolute;top:16px;left:50%;transform:translateX(-50%);border:1px solid #e1d1b9;background:#fffaf1ed;padding:9px 17px;border-radius:18px;font-size:12px;color:#8f7254;white-space:nowrap;pointer-events:none}.control-strip{min-height:48px;padding:13px 20px;display:flex;align-items:center;justify-content:center;gap:9px;color:#a18b76;font-size:12px}.status-dot{width:6px;height:6px;background:#a8b48d;border-radius:50%}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#6d594a28;backdrop-filter:blur(3px)}.modal{width:390px;max-width:100%;max-height:100%;overflow:auto;text-align:center;padding:26px;background:#fffcf4;border:1px solid #e3d5c2;border-radius:23px;box-shadow:0 10px 30px #71593f25}.modal h2{font-size:27px;line-height:1.3;letter-spacing:-1.4px;margin:15px 0;color:#785c49}.modal p{font-size:12px;line-height:1.7;color:#aa9179;margin:12px 0}.badge{font-size:10px;font-weight:bold;letter-spacing:1px;color:#b98c90}.primary,.secondary{width:100%;padding:13px 15px;border-radius:12px;font-weight:bold;font-size:13px}.primary{background:#cb9699;color:#fffcf5;box-shadow:0 3px #b68286}.primary:hover{background:#bd858a}.secondary{background:#f0ebdf;margin-top:9px;color:#9a8268}.secondary:hover{background:#e7dfce}.primary:active{transform:translateY(1px)}input{width:100%;padding:11px 12px;border:1px solid #e4d6c2;background:#fffef8;border-radius:10px;color:#785f49;margin:5px 0 12px;font-size:13px}input::placeholder{color:#baa58b}label{font-size:11px;color:#a18b75}.error{font-size:12px;color:#ba7876;min-height:1em}.error:empty{min-height:0}.roster{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:14px 0;max-height:165px;overflow:auto;text-align:left}.member{font-size:11px;line-height:1.8;background:#f2ebdd;border-radius:8px;padding:6px 9px}.room-tools{display:flex;gap:8px}.steps{display:flex;gap:7px;margin:18px 0}.steps div{flex:1;background:#f1eade;border-radius:10px;padding:12px 5px;font-size:11px;line-height:1.8}.steps b{display:block;font-size:18px;color:#b68183}.result{max-height:160px;overflow:auto;font-size:13px;line-height:2.2;text-align:left}.note{font-size:11px!important;color:#ac977d;line-height:1.7}dialog{width:min(420px,calc(100% - 36px));border:1px solid #dfd0ba;border-radius:22px;padding:22px;background:#fffcf4;color:#80664f;box-shadow:0 18px 80px #715a4140;max-height:80dvh;overflow:auto}dialog::backdrop{background:#4c3e3455;backdrop-filter:blur(3px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.dialog-head h2{margin:0;font-size:19px}#helpSection{font-size:13px;line-height:2}ol{padding-left:22px}.row{display:flex;align-items:center;gap:10px;padding:12px 8px;font-size:12px;border-bottom:1px solid #eee3d2}.row.mine{background:#f3e1e2;border-radius:9px}.row b:last-child{margin-left:auto}.avatar{display:grid;place-items:center;width:28px;height:28px;color:#fffaf1;border-radius:8px}#ranking{max-height:45dvh;overflow:auto}#connection{font-size:12px;color:#9a866c}.notification{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 18px;max-width:90%;border-radius:12px;background:#8b745f;color:#fffaf0;font-size:12px;z-index:20}.hidden{display:none!important}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}#count{font-size:64px;color:#b88489}.timer-low{color:#bc7772!important}@media(max-width:600px){.app{width:100%;padding:12px 10px}header{margin:0 3px 12px}h1{font-size:18px}.buttons{gap:5px}.buttons button{width:36px;height:36px;border-radius:12px}.game-shell{border-radius:18px}.scorebar{padding:14px 10px;gap:6px}.stat b{font-size:21px}.stat label{font-size:10px}.game-state{font-size:10px;top:9px;padding:6px 10px}.control-strip{font-size:10px;padding:10px;min-height:42px}.overlay{padding:12px}.arena:has(.overlay:not(.hidden)){min-height:450px}.arena:has(.overlay:not(.hidden)) canvas{position:absolute;inset:0;height:100%;object-fit:cover}.modal{padding:20px;max-height:425px}.modal h2{font-size:24px}.modal .roster{max-height:110px}}@media(max-height:600px) and (min-width:601px){.app{width:min(100% - 24px,700px);padding:8px 0}header{margin-bottom:8px}.scorebar{padding:8px}.stat b{font-size:18px}.buttons button{height:32px;width:32px}.control-strip{min-height:34px;padding:8px}.modal{padding:16px}}
</style><body><main class="app"><header><h1>피드백 <span>스트라이크!</span></h1><div class="buttons"><button id="help" aria-label="게임 방법">?</button><button id="pause" aria-label="일시정지">Ⅱ</button><button id="menu" aria-label="설정">☰</button></div></header><section class="game-shell"><div class="scorebar"><div class="stat"><label>남은 시간</label><b id="time">02:30</b></div><div class="stat score-stat"><label>내 피드백</label><b id="score">0 PT</b></div><button class="stat rank-stat" id="rankButton" aria-label="전체 순위 보기"><label>내 순위 ↗</label><b id="myRank">—</b></button></div><div class="arena"><canvas id="game" aria-label="누른 채 조준하고 파워를 충전한 뒤 놓아 투구하세요"></canvas><div class="game-state"><span id="opportunity">준비됐나요?</span></div><div id="overlay" class="overlay"><div class="modal" id="modal"></div></div></div><div class="control-strip"><span class="status-dot"></span><span id="hint">누르고 충전 · 놓아서 투구</span></div></section><span id="phasePill" class="visually-hidden"></span></main><dialog id="infoDialog"><div class="dialog-head"><h2 id="infoTitle">게임 방법</h2><button id="closeInfo" aria-label="닫기">×</button></div><p id="liveNote" class="note"></p><section id="helpSection"><ol><li>제출함 방향을 조준해요.</li><li>길게 눌러 파워를 충전해요.</li><li>착지점이 초록색이면 놓으세요!</li></ol><p>회의가 끝났을 때만 피드백을 받아요.</p><div class="steps"><div>GOOD <b>+1</b></div><div>GREAT <b>+2</b></div><div>PERFECT <b>+3</b></div></div><p class="note">3콤보마다 +1 · 5콤보마다 빠른 연속 투구</p></section><section id="rankSection"><div id="ranking"></div><p class="note">최고 연속 성공 <b id="combo">0</b></p></section><section id="settingsSection"><p id="connection"></p><button id="sound" class="secondary">♪ ON</button><button id="leave" class="secondary">게임 나가기</button></section></dialog><div id="notification" class="notification hidden" role="status"></div><script>const RULES={duration:150,maxPlayers:14,hitRadius:46,greatRadius:27,perfectRadius:12,chargeSeconds:1.05,cooldown:.6,rapidCooldown:.23,meeting:4,open:10};
const COLORS=['#eb744f','#639bbc','#9b81bd','#d8a244','#5eaa8c','#d87e9a','#6680bc','#ab9e54','#ba775e','#78aab0','#87765b','#ac82a4','#71a064','#9c8f7d'];
const EVENTS=[{type:'away',name:'🚽 화장실 탈주',warning:'팀장님이 잠시 자리를 비웁니다!',duration:2.5},{type:'coffee',name:'☕ 커피 방패',warning:'커피가 날아옵니다! 주황색 영역을 피하세요',duration:5},{type:'dodge',name:'🏃 걸으면서 볼게요',warning:'팀장님이 곧 빠르게 이동해요!',duration:5},{type:'meeting',name:'📅 긴급 회의',warning:'곧 접수가 3초간 중단돼요!',duration:3},{type:'rush',name:'💬 선착순 보너스',warning:'다음 3건은 피드백 +1!',duration:6},{type:'double',name:'🔥 폭풍 피드백',warning:'잠시 후 모두 피드백 2배!',duration:6}];
function trajectory(p,u){return {x:p.sx+(p.ex-p.sx)*u,y:p.sy+(p.ey-p.sy)*u-4*u*(1-u)*125}}
function endPoint(aim,power){let dx=aim.x-500,dy=Math.min(-65,aim.y-575),l=Math.hypot(dx,dy),range=105+power*410;return {x:500+dx/l*range,y:575+dy/l*range}}
function flightTime(end){return .22+Math.hypot(end.x-500,end.y-575)/1800}
function bossAt(time,event){const dodge=event?.warn<=0&&event.type==='dodge';return {x:590+Math.sin(time*(dodge?2.4:1.05))*(44+time*.14),y:300+Math.sin(time*.5)*8}}
function targetAt(time,event){const p=bossAt(time,event);return {x:p.x+35,y:p.y+50}}
function cupAt(t){return{x:520+Math.sin(t*2)*125,y:330+Math.cos(t)*35}}
function predictedTarget(state,end){return targetAt(state.elapsed+flightTime(end),state.event)}
function newPlayer(id,name,index){return{id,name,color:COLORS[index%COLORS.length],score:0,combo:0,maxCombo:0,hits:0,throws:0,lastShot:-100,bombUntil:0,ready:false,connected:true,lastSeq:0}}
class Game{
 constructor(random=Math.random){this.random=random;this.players=[];this.status='lobby';this.elapsed=0;this.remaining=150;this.phase='meeting';this.phaseLeft=4;this.available=0;this.capacity=0;this.event=null;this.projectiles=[];this.effects=[];this.effectId=0;this.shotId=0;this.round=0;this.countdown=0;this.nextEvent=8;this.bag=[];this.rushLeft=0;this.pauseLeft=0;this.pauses=0;this.meetingAdjusted=false}
 add(p){this.players.push(p)}
 start(practice=false){this.round++;this.status='countdown';this.countdown=3;this.duration=practice?30:150;this.remaining=this.duration;this.elapsed=0;this.phase='meeting';this.phaseLeft=4;this.capacity=Math.max(8,this.players.length*3);this.available=this.capacity;this.event=null;this.projectiles=[];this.effects=[];this.nextEvent=8;this.bag=[];this.rushLeft=0;this.pauses=0;this.practice=practice;this.meetingAdjusted=false;for(const p of this.players)Object.assign(p,{score:0,combo:0,maxCombo:0,hits:0,throws:0,lastShot:-100,bombUntil:0,lastSeq:0})}
 isOpen(){return this.status==='playing'&&this.phase==='open'&&this.available>0&&!(this.event?.warn<=0&&['away','meeting'].includes(this.event.type))}
 effect(text,x=600,y=300,color='#df6a48',owner=null){this.effects.push({id:++this.effectId,text,x,y,color,owner});if(this.effects.length>40)this.effects.shift()}
 pause(){if(this.status==='playing'&&this.pauses<2){this.status='paused';this.pauseLeft=30;this.pauses++;return true}if(this.status==='paused'){this.status='playing';return true}return false}
 shoot(id,msg){const p=this.players.find(p=>p.id===id);if(!p||!p.connected||this.status!=='playing')return false;if(!Number.isSafeInteger(msg.seq)||msg.seq<=p.lastSeq||![msg.x,msg.y,msg.power].every(Number.isFinite)||msg.x<0||msg.x>1000||msg.y<0||msg.y>680||msg.power<0||msg.power>1)return false;p.lastSeq=msg.seq;const cd=p.bombUntil>this.elapsed?RULES.rapidCooldown:RULES.cooldown;if(this.elapsed-p.lastShot<cd)return false;const end=endPoint(msg,msg.power);p.lastShot=this.elapsed;p.throws++;this.projectiles.push({id:++this.shotId,owner:id,sx:500,sy:575,ex:end.x,ey:end.y,age:0,duration:flightTime(end)});return true}
 miss(p,shot,reason){p.combo=0;this.effect(reason,shot.ex,shot.ey,'#738778',p.id)}
 impact(shot){const p=this.players.find(p=>p.id===shot.owner);if(!p)return;const t=targetAt(this.elapsed,this.event),d=Math.hypot(shot.ex-t.x,shot.ey-t.y);if(!this.isOpen()){this.miss(p,shot,this.available<=0?'접수 마감!':'지금은 회의 중!');return}if(d>=RULES.hitRadius){this.miss(p,shot,'아깝다! MISS');return}this.available--;p.hits++;p.combo++;p.maxCombo=Math.max(p.maxCombo,p.combo);const base=d<RULES.perfectRadius?3:d<RULES.greatRadius?2:1;let pts=base*(this.event?.type==='double'&&this.event.warn<=0?2:1);if(p.combo%3===0)pts++;if(this.event?.type==='rush'&&this.event.warn<=0&&this.rushLeft>0){pts++;this.rushLeft--}if(p.combo%5===0){p.bombUntil=this.elapsed+5;this.effect('📚 업무 폭탄! 5초 연속 투구',500,440,p.color,p.id)}p.score+=pts;this.effect(['','GOOD','GREAT','PERFECT'][base]+' +'+pts,t.x,t.y,p.color,p.id)}
 tick(dt){if(!Number.isFinite(dt)||dt<=0)return;if(this.status==='countdown'){this.countdown-=dt;if(this.countdown<=0)this.status='playing';return}if(this.status==='paused'){this.pauseLeft-=dt;if(this.pauseLeft<=0)this.status='playing';return}if(this.status!=='playing')return;this.elapsed+=dt;this.remaining=Math.max(0,this.duration-this.elapsed);if(this.remaining<=0){this.status='result';this.projectiles=[];return}this.phaseLeft-=dt;if(this.phase==='meeting'&&!this.meetingAdjusted&&this.phaseLeft<1.2){this.meetingAdjusted=true;const r=this.random();if(r<.18){this.phaseLeft+=1.4;this.effect('회의가 조금 연장됐어요',500,230)}else if(r>.85){this.phaseLeft=.1;this.effect('회의 조기 종료!',500,230)}}if(this.phaseLeft<=0){this.phase=this.phase==='meeting'?'open':'meeting';this.phaseLeft=this.phase==='open'?10:4;this.meetingAdjusted=false;if(this.phase==='open')this.available=this.capacity}
 if(!this.practice&&!this.event&&this.elapsed>=this.nextEvent&&this.phase==='open'&&this.phaseLeft>5){if(!this.bag.length){this.bag=[...EVENTS];for(let i=this.bag.length-1;i>0;i--){const j=Math.floor(this.random()*(i+1));[this.bag[i],this.bag[j]]=[this.bag[j],this.bag[i]]}}this.event={...this.bag.pop(),warn:2};this.rushLeft=3}
 if(this.event){if(this.event.warn>0)this.event.warn-=dt;else{this.event.duration-=dt;if(this.event.duration<=0){this.event=null;this.nextEvent=this.elapsed+4+this.random()*4}}}
 this.projectiles.sort((a,b)=>(b.duration-b.age)-(a.duration-a.age)||b.id-a.id);
 for(let i=this.projectiles.length-1;i>=0;i--){const shot=this.projectiles[i];shot.age+=dt;const u=Math.min(1,shot.age/shot.duration),pos=trajectory(shot,u),p=this.players.find(p=>p.id===shot.owner);if(this.event?.type==='coffee'&&this.event.warn<=0){const c=cupAt(this.elapsed);if(Math.hypot(pos.x-c.x,pos.y-c.y)<33){if(p)this.miss(p,shot,'☕ 커피 방패!');this.projectiles.splice(i,1);continue}}if(u>=1){this.impact(shot);this.projectiles.splice(i,1)}}}
 snapshot(){return{status:this.status,round:this.round,countdown:this.countdown,elapsed:this.elapsed,remaining:this.remaining,phase:this.phase,phaseLeft:this.phaseLeft,capacity:this.capacity,available:this.available,event:this.event,projectiles:this.projectiles,effects:this.effects,players:this.players.map(({lastSeq,lastShot,...p})=>p),pauseLeft:this.pauseLeft,pauses:this.pauses}}
}

const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),W=1000,H=680;
let state=null,local=null,identity=null,online=false,connecting=false,streamController=null,pingTimer=null,reconnectTimer=null,retry=0,lastPacket=0,epoch=0,view='',charge=false,chargeTime=0,power=0,aim={x:630,y:350},seq=0,lastThrow=-10,noticeTimer,elapsed=0,mode='intro',sound=true,audioCtx,lastFrame=0,lastEffect=0,effects=[],particles=[],lastRound=-1;
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('notification').textContent=s;$('notification').classList.remove('hidden');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notification').classList.add('hidden'),3000)}
function beep(f=550,d=.09){if(!sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.04,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch{}}
const me=()=>state?.players.find(p=>p.id===identity?.id);
function open(){return state?.status==='playing'&&state.phase==='open'&&state.available>0&&!(state.event?.warn<=0&&['away','meeting'].includes(state.event.type))}
async function request(path,data,auth=true){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',...(auth&&identity?{Authorization:'Bearer '+identity.token}:{})},body:JSON.stringify(data),signal:AbortSignal.timeout(8000)});const json=await r.json();if(!r.ok)throw Object.assign(new Error(json.error||'연결 오류'),{status:r.status});return json}
function cancelCharge(){charge=false;power=0}
function cleanup(){epoch++;clearTimeout(reconnectTimer);clearInterval(pingTimer);streamController?.abort();online=false;connecting=false;cancelCharge()}
function saveSession(){try{if(identity?.token)sessionStorage.setItem('feedback-room',JSON.stringify(identity));else sessionStorage.removeItem('feedback-room')}catch{}}
function receive(s){state=s;lastPacket=performance.now();if(s.round!==lastRound){lastRound=s.round;lastEffect=0;lastThrow=-10;effects=[];particles=[];cancelCharge()}for(const e of s.effects||[]){if(e.id>lastEffect){lastEffect=e.id;if(!e.owner||e.owner===identity?.id){effects.push({...e,life:1.5});beep(e.text.includes('MISS')?160:700);if(/GOOD|GREAT|PERFECT/.test(e.text))for(let i=0;i<14;i++)particles.push({x:e.x,y:e.y,vx:(Math.random()-.5)*200,vy:-Math.random()*150,life:.7,color:e.color})}}}if(s.status!=='playing')cancelCharge();renderUI()}
async function connect(){const myEpoch=epoch;if(!identity?.token)return;connecting=true;online=false;renderUI();streamController=new AbortController();let failure;try{const r=await fetch('/api/events',{headers:{Authorization:'Bearer '+identity.token},signal:streamController.signal});if(!r.ok){const x=await r.json();throw Object.assign(new Error(x.error),{status:r.status})}online=true;connecting=false;retry=0;const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='';while(myEpoch===epoch){const {value,done}=await reader.read();if(done)throw new Error('연결이 끊어졌어요');buffer+=decoder.decode(value,{stream:true});const packets=buffer.split('\n\n');buffer=packets.pop();for(const packet of packets){if(packet.startsWith('data: ')){receive(JSON.parse(packet.slice(6)))}}}}catch(e){failure=e}if(myEpoch!==epoch)return;online=false;connecting=false;cancelCharge();if(failure?.status===401){cleanup();identity=null;saveSession();state=null;view='';home('서버가 재시작됐거나 방이 만료됐어요. 다시 입장해주세요.');return}renderUI();reconnectTimer=setTimeout(connect,Math.min(5000,500*2**retry++))}
function activateSession(data){cleanup();identity=data;saveSession();local=null;state=null;view='';lastRound=-1;seq=Date.now();history.replaceState(null,'','?room='+encodeURIComponent(data.code));connect();pingTimer=setInterval(()=>{request('/api/action',{type:'ping'}).catch(()=>{});if(online&&performance.now()-lastPacket>5000){online=false;cancelCharge();streamController?.abort();renderUI()}},4000)}
async function action(data){if(local){if(data.type==='pause')local.pause();else if(data.type==='shoot')local.shoot(identity.id,data);receive(local.snapshot());return}if(!online){toast('재연결 중이에요. 잠시만 기다려주세요.');return}try{await request('/api/action',data)}catch(e){if(data.type!=='shoot')toast(e.message)}}
